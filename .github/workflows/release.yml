# Build the Windows installer/zip and the macOS DMG, and attach them to a
# GitHub release. Runs on version tags, or on demand via "Run workflow"
# (workflow_dispatch) with an existing tag name to (re)build assets for it.
#
# macOS: GitHub's free runners are Apple Silicon (macos-14+), so CI ships an
# arm64 DMG. Intel users are a shrinking minority (last Intel Mac sold 2021,
# macOS 26 is the final version supporting them); if an x86_64 DMG is ever
# needed, run packaging/build_macos.sh on an Intel Mac or under a Rosetta
# x86_64 Python.
#
# The binaries are unsigned (see packaging/README.md) — CI cannot change
# that; SmartScreen/Gatekeeper bypass steps are documented in docs/INSTALL.md.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the built assets to"
        required: true
        type: string

# Least privilege by default. Only the release job writes anything; the build
# jobs run third-party actions and package managers, and checkout leaves the
# token on disk, so they get read-only.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # Build what the tag names. Without an explicit ref, a
      # workflow_dispatch run checks out the selected branch while the
      # release job attaches the result to `inputs.tag` — publishing assets
      # built from different code than the tag they ship under.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      # build_windows.bat finds ISCC at its default install path and then
      # produces dist\VideoDownloader-Setup-win64.exe; the portable zip is
      # only its no-Inno fallback, so create it explicitly as well.
      - name: Build installer
        shell: cmd
        run: packaging\build_windows.bat
      - name: Build portable zip
        shell: pwsh
        run: Compress-Archive -Path 'dist\VideoDownloader\*' -DestinationPath 'dist\VideoDownloader-win64.zip' -Force
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: |
            dist/VideoDownloader-Setup-win64.exe
            dist/VideoDownloader-win64.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-15 # Apple Silicon -> arm64 DMG (macos-14 retires 2026-11)
    steps:
      # Build what the tag names. Without an explicit ref, a
      # workflow_dispatch run checks out the selected branch while the
      # release job attaches the result to `inputs.tag` — publishing assets
      # built from different code than the tag they ship under.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build .app + DMG
        # bash, not ./ — survives a checkout where the exec bit was lost
        # (files committed from Windows).
        run: bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: dist/VideoDownloader-macos-*.dmg
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release / upload assets
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true
      - name: Attach assets to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: assets/*
          # A tag push creates/updates the release; workflow_dispatch attaches
          # to the tag named in the input (creating the release if missing).
          fail_on_unmatched_files: true
